name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The Swift package lives at Sources/, so every SwiftPM command uses --package-path Sources.
# The package requires Swift tools 6.4 (Sources/Package.swift); the `xcode-27` runner image is the
# only GitHub-hosted image carrying Xcode 27, and it runs on macOS 27 (arm64 only). It is a public
# preview whose default Xcode is 27.0 beta 6 (27A5252f), so the toolchain step below pins the
# expectation to the Swift 6.4 line rather than to one exact build: a beta-to-release move inside
# 6.4 must not fail the gate, while a move off 6.4 must.
# https://github.blog/changelog/2026-09-10-xcode-27-runner-image-now-runs-on-macos-27/
# If that preview image is retired, `macos-26` is the fallback — but it ships Swift 6.3.3 and the
# assertion below fails there loudly, which is the intended behaviour.
# Integration tests require ffmpeg/ffprobe (Homebrew formula `ffmpeg`) and ImageMagick (`magick`,
# Homebrew formula `imagemagick`). Both are installed below with Homebrew's implicit update
# disabled, and their versions are printed so a change is visible in the log.

permissions:
  contents: read

jobs:
  build-and-test:
    name: Swift build and tests (macOS)
    runs-on: xcode-27
    env:
      CONVERTER_AUTO_INSTALL_DEPS: "0"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      # Pinned by commit SHA (v4). Update the SHA and this comment together with Dependabot or
      # `gh api repos/actions/checkout/git/ref/tags/v4`; a moving tag is not reproducible.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify the committed release binary
        run: shasum -a 256 -c docs/converter.sha256

      - name: Select the required toolchain
        run: |
          if [ -d /Applications/Xcode_27.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          fi
          sw_vers
          xcodebuild -version
          swift --version
          swift --version | grep -q 'Swift version 6.4' \
            || { echo "This package requires Swift 6.4 (see Sources/Package.swift)"; exit 1; }

      - name: Install media toolchain (ffmpeg, imagemagick) and swiftlint
        run: |
          brew install ffmpeg imagemagick swiftlint
          ffmpeg -version | head -1
          ffprobe -version | head -1
          magick -version | head -1
          swiftlint version

      # Ratchet, not a rewrite: fails only when violations grow beyond scripts/lint-budget.json.
      # A swiftlint version change is reported but does not fail the build.
      - name: Lint budget (no new violations)
        run: scripts/lint-budget.sh

      - name: Build (warnings are errors)
        run: swift build --package-path Sources -Xswiftc -warnings-as-errors

      # The strict C++ pass covers the BW64 bridge and the vendored libbw64 headers (#0062).
      - name: Build release with strict C++ flags
        run: >
          swift build --package-path Sources -c release
          -Xswiftc -warnings-as-errors -Xcc -Wall -Xcc -Wextra -Xcc -Werror

      - name: Test
        run: swift test --package-path Sources

  # The cheap half of the §1 toolchain, on the same image so the Swift tools match the build job.
  # The expensive checks — sanitizer builds, coverage, the two-engine full-history secret scan —
  # stay in the documented audit procedure instead of running on every push.
  static-analysis:
    name: Static analysis and scanners
    runs-on: xcode-27
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install analysers
        run: |
          brew install swiftlint semgrep gitleaks cppcheck llvm ruff mypy
          swiftlint version
          semgrep --version
          gitleaks version
          cppcheck --version
          ruff --version
          mypy --version

      # Reported, not enforced: .swift-format and scripts/check-format.sh are in place, but the tree
      # is not formatter-clean yet. Adopting the pass regresses the swiftlint budget (trailing_comma
      # 0->145, opening_brace 0->31, error-level 19->21) because the two tools disagree about
      # punctuation and brace placement, so task #0106 is BLOCKED on an owner decision about which
      # tool is authoritative. Flip this to a failing step when that decision lands.
      - name: Swift format (advisory)
        continue-on-error: true
        run: >
          swift format lint --recursive --parallel --configuration .swift-format
          Sources/converter Sources/Tests

      - name: Swift lint budget
        run: scripts/lint-budget.sh

      # AUDIT/tools/*.py is the repository's only Python; settings live in pyproject.toml.
      - name: Python format, lint and strict types
        run: scripts/check-python.sh

      - name: Secret scan (repository history)
        run: gitleaks git --config .gitleaks.toml --no-banner --redact=100 .

      - name: SAST (Swift, C, security audit)
        run: >
          semgrep scan --error
          --config p/swift --config p/c --config p/security-audit
          --exclude Sources/.build --exclude Sources/ThirdParty
          Sources

      # Exhaustive level (not just the default branch limit) and a clean exit code: the vendored
      # libbw64 headers are excluded from the *gate* only — their integrity is verified against the
      # upstream tag by hash (Sources/ThirdParty/libbw64/UPSTREAM.md), and their style is upstream's.
      # checkersReport is cppcheck's own informational summary, not a finding.
      - name: C++ static analysis (cppcheck)
        run: >
          cppcheck --enable=all --check-level=exhaustive --error-exitcode=1 --std=c++17 --inline-suppr
          --suppress=missingIncludeSystem --suppress=checkersReport
          --suppress='*:*/ThirdParty/*'
          -I Sources/ThirdParty/libbw64 -I Sources/BW64Bridge/include
          Sources/BW64Bridge/bw64_bridge.cpp

      # The vendored libbw64 headers legitimately produce diagnostics of their own, so the gate is
      # "no first-party finding", not "clang-tidy printed nothing". Measured locally and on node2: 0.
      - name: C++ static analysis (clang-tidy)
        run: |
          "$(brew --prefix llvm)/bin/clang-tidy"
            Sources/BW64Bridge/bw64_bridge.cpp
            -checks='bugprone-*,cert-*,clang-analyzer-*,performance-*,misc-*,-misc-include-cleaner'
            -- -std=c++17 -I Sources/ThirdParty/libbw64 -I Sources/BW64Bridge/include
            -isysroot "$(xcrun --show-sdk-path)" 2>&1 | tee /tmp/clang-tidy.log
          findings=$(grep -cE 'bw64_bridge\.cpp.*(warning|error):' /tmp/clang-tidy.log || true)
          echo "first-party clang-tidy findings: $findings"
          test "$findings" -eq 0
